# 숏폼 자동 편집기 설정
# 메모장으로 열어서 = 오른쪽 값을 바꾸고 저장하세요.
# 영상 파일을 run.bat 위로 끌어다 놓으면 이 설정으로 실행돼요.

[shorts]
# 디자인: green / magenta / overlay / basic / 또는 내스타일.json
style = green

# 만들 숏폼 개수
count = 7

# 숏폼 길이 범위 (초)
min_len = 20
max_len = 60

# 영상 설명: 누가, 무슨 내용인지 (하이라이트와 제목이 더 정확해져요)
context = 꼴통사장 권기준 대표의 사업 강의. 창업, 매출, 사장 마인드, 크리에이터로 돈 버는 법

# 인물 소개 줄에 고정으로 넣을 문구 (비우면 AI가 정해요)
speaker = 권기준 / 꼴통사장 대표

# 영상을 확대해서 좌우를 자를 때 남길 위치: 0.5 가운데 / 0.3 왼쪽 / 0.7 오른쪽
focus = 0.5

# 음성 인식 모델: small (빠름) / medium / large-v3 (정확하지만 느림)
model = small

# 글꼴 (비우면 스타일 기본값인 맑은 고딕)
font =
