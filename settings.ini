# 숏폼 자동 편집기 설정
# 메모장으로 열어서 = 오른쪽 값을 바꾸고 저장하세요.
# 영상 파일을 run.bat 위로 끌어다 놓으면 이 설정으로 실행돼요.

[shorts]
# 디자인: green / magenta / overlay / basic / 또는 내스타일.json
style = green

# 만들 숏폼 개수
count = 10

# 숏폼 길이 범위 (초)
min_len = 20
max_len = 60

# 영상 설명: 누가, 무슨 내용인지 (하이라이트와 제목이 더 정확해져요)
context = 꼴통사장 권기준 대표의 사업 강의. 창업, 매출, 사장 마인드, 크리에이터로 돈 버는 법

# 인물 소개 줄에 고정으로 넣을 문구 (비우면 AI가 정해요)
speaker = 권기준 / 꼴통사장 대표

# 화면 위치: auto 면 얼굴을 따라가요 / 숫자면 고정 (0.5 가운데, 0.3 왼쪽, 0.7 오른쪽)
focus = auto

# 음성 인식 모델: small (빠름) / medium / large-v3 (정확하지만 느림)
model = small

# 글꼴 (비우면 스타일 기본값인 맑은 고딕)
font =

# 만들기 전에 메모장으로 숏폼 목록을 보여주고 고르게 해요: yes / no
review = yes

# 자막 오타를 Claude가 문맥을 보고 고치고 자연스럽게 끊어요: yes / no
fix_subtitles = yes

# 핵심 단어가 나올 때 화면을 살짝 확대해요: yes / no
zoom = yes

# 확대할 때 효과음을 넣어요: yes / no (sfx 폴더에 소리 파일을 넣으면 그걸 써요)
sfx = yes

# 배경음악 볼륨 0~1 (bgm 폴더에 음악 파일을 넣으면 숏폼마다 깔아요)
bgm_volume = 0.15

# 썸네일 이미지도 만들어요: yes / no
thumbnail = yes

# 유튜브 업로드: no / private (비공개) / unlisted (일부 공개) / public (공개)
# 처음 한 번 설정이 필요해요. README의 '유튜브 자동 업로드'를 보세요.
upload = no
