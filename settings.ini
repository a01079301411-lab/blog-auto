# 숏폼 자동 편집기 설정
# 메모장으로 열어서 = 오른쪽 값을 바꾸고 저장하세요.
# 영상 파일을 run.bat 위로 끌어다 놓으면 이 설정으로 실행돼요.

[shorts]
# 영상 종류: 좋은 숏폼 장면과 제목 말투가 영상마다 달라요
# lecture (강의·인터뷰, 꼴통사장 등) / vlog (내 채널 브이로그, 여친 있는 유부남)
# moving (이사 현장) / commerce (코시 제품 광고) / custom (아래 영상 설명대로)
guide = lecture

# 코시 인스타 계정 번호 (쉼표로 여러 개): 계정마다 컨셉에 맞는 구간을 골라
# 그 계정 가이드의 글꼴·색·배치로 만들고, 계정(채널)별 폴더에 저장해요.
# 1 대표들의 말 못할 비밀 / 2 사업 레시피 / 3 사장은 처음이라 / 4 꼴통 강사 권기준
# 5 크리에이터 비밀노트 / 6 1% 라이프 / 7 성공 취조실 / 8 수억 버는 쉬었음 청년
# 9 퇴사한 김부장 / 10 인생 역전 story      (비우면 아래 style 디자인으로 만들어요)
accounts = 1,2,3,4

# 계정당 만들 숏폼 개수 (퀘스트: 채널별 3개)
per_account = 3

# 계정을 비웠을 때 쓰는 디자인: green / magenta / overlay / basic / 또는 내스타일.json
style = green

# 만들 숏폼 개수
count = 10

# 영상을 여러 개 넣었을 때 하나로 합쳐서 전체에서 숏폼 개수만큼만: yes / no
# (no면 영상마다 숏폼 개수만큼씩 만들어요)
merge = no

# 숏폼 길이 범위 (초)
min_len = 15
max_len = 60

# 영상 설명: 누가, 무슨 내용인지 (하이라이트와 제목이 더 정확해져요)
context = 꼴통사장 권기준 대표의 사업 강의. 창업, 매출, 사장 마인드, 크리에이터로 돈 버는 법

# 인물 소개 줄에 고정으로 넣을 문구 (비우면 AI가 정해요)
speaker = 권기준 / 꼴통사장 대표

# 화면 위치: auto 면 얼굴을 따라가요 / 숫자면 고정 (0.5 가운데, 0.3 왼쪽, 0.7 오른쪽)
focus = auto

# 음성 인식 모델: small (빠름) / medium / large-v3 (정확하지만 느림)
model = small

# 글꼴 (비우면 스타일 기본값인 맑은 고딕)
font =

# 자막 넣기: yes / no (no면 자막 없이 만들어요. 원본에 자막이 있으면 어차피 원본 자막을 써요)
subtitles = yes

# 만들기 전에 메모장으로 숏폼 목록을 보여주고 고르게 해요: yes / no
review = no

# 고르기 창(롱폼은 순서표)을 띄워 놓고 이 시간(분) 동안 아무것도 안 누르면 그대로 만들기 시작해요.
# 밤새 돌려 놓아도 멈추지 않아요. 창에서 아무거나 누르면 기다리기를 멈추고 직접 고를 수 있어요.
# 0이면 직접 누를 때까지 기다려요.
review_wait = 3

# 자막 오타를 Claude가 문맥을 보고 고치고 자연스럽게 끊어요: yes / no
fix_subtitles = yes

# 원본 영상에 이미 자막이 박혀 있을 때: auto (찾으면 새 자막은 안 넣고 원본 자막이
# 잘리지 않게 화면을 잡아요) / yes (항상 원본 자막만) / no (항상 새 자막)
burned_subs = auto

# 배경음악: auto (숏폼 분위기에 맞는 곡을 프로그램이 직접 만들어 깔아요. 저작권 걱정 없음)
#          folder (bgm 폴더의 음악을 돌아가며) / none (안 깔아요)
bgm_source = auto

# 배경음악 볼륨 0~1 (말할 때는 자동으로 작아져요)
bgm_volume = 0.15

# 시청 지속 장치: 처음 2초 훅 자막, 결론 직전 한마디, 위쪽 진행 막대: yes / no
retention = yes

# 캡컷처럼: '음', '어' 같은 군말 잘라내기: yes / no
fillers = yes

# 목소리 또렷하게 (잡음 줄이고 소리 크기 맞추기): yes / no
voice_enhance = yes

# '짤' 폴더의 사진·짧은 영상을 자막에 맞춰 끼워 넣기 (폴더가 비어 있으면 안 넣어요): yes / no
inserts = yes

# 캡컷 자동 자막처럼 지금 말하는 단어에 색 채우기: yes / no
karaoke = no

# 자막이 나올 때 살짝 튀어나오기: yes / no
sub_pop = yes

# 자동 색 보정 (어두우면 밝게, 흐리면 선명하게): yes / no
auto_color = yes

# 썸네일 이미지도 만들어요: yes / no
thumbnail = yes

# 유튜브 업로드: no / private (비공개) / unlisted (일부 공개) / public (공개)
# 처음 한 번 설정이 필요해요. README의 '유튜브 자동 업로드'를 보세요.
upload = no

[longform]
# ─── 롱폼 만들기 (프로그램 창의 '롱폼 만들기' 탭, run_long.bat) ───
# 여러 촬영본과 기획안(hwp/docx/txt)을 넣으면 기획안 순서대로 편집해요.

# 채널 설명: 세계관과 출연자 (편집 순서·제목·썸네일 문구가 이 컨셉에 맞춰져요)
long_context = '여친 있는 유부남' 채널. 여친은 딸 셋, 본처는 아내. 5인 가족 아빠의 딸 데이트, 아내와 데이트, 크로스핏 등 취미, 이사업체 사장 일상 브이로그

# 목표 길이(분): 0이면 AI가 좋은 장면 분량에 맞춰 정해요
long_minutes = 0

# 유료광고(협찬·커머스) 영상: yes면 시작과 끝에 '유료광고 포함'을 표시해요
long_commerce = no

# 만들기 전에 편집 순서표를 보고 고치기: yes / no
long_review = no

# 촬영본 장면 사진도 AI에게 보여주기 (말 없는 풍경·행동 장면을 알아봐요): yes / no
long_frames = yes

# 말과 말 사이 1초 넘게 끊긴 곳 잘라내기 (말 없는 장면은 그대로): yes / no
long_jumpcut = yes

# 자막 넣기 / Claude로 자막 오타 고치기: yes / no
long_subtitles = yes
long_fix_subtitles = yes

# 챕터가 바뀔 때 화면 왼쪽 위에 챕터 제목 띄우기: yes / no
long_chapter_titles = yes

# 배경음악: auto (분위기에 맞는 곡을 프로그램이 직접 만들어 깔아요. 저작권 걱정 없음)
#          folder (bgm 폴더의 음악) / none (안 깔아요)
long_bgm_source = auto

# 캡컷처럼: '음', '어' 같은 군말 잘라내기: yes / no
long_fillers = yes

# 목소리 또렷하게 (잡음 줄이고 소리 크기 맞추기): yes / no
long_voice_enhance = yes

# '짤' 폴더의 사진·짧은 영상을 자막에 맞춰 끼워 넣기: yes / no
long_inserts = yes

# 자동 색 보정 (어두우면 밝게, 흐리면 선명하게): yes / no
long_auto_color = yes

# 배경음악 볼륨 0~1 (말할 때는 자동으로 줄여요)
long_bgm_volume = 0.10

# 썸네일 이미지 만들기: yes / no
long_thumbnail = yes

# 음성 인식 모델: small (빠름) / medium / large-v3 (정확하지만 느림)
long_model = small

# 출력 해상도: auto (1920x1080) / 2160 (촬영본이 4K면 4K로. 화질은 좋지만 2~4배 오래 걸려요)
# 프레임은 촬영본에 맞춰요 (60fps로 찍었으면 60fps). 아이폰 HDR 영상은 색을 자동으로 맞춰요
long_resolution = auto

# 자막 글꼴 (비우면 Pretendard → 지마켓 산스 → 맑은 고딕 순으로 찾아요)
long_font =
